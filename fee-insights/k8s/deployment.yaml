apiVersion: apps/v1
kind: Deployment
metadata:
  name: fee-insights
  labels:
    app: fee-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fee-insights
  # Recreate, not RollingUpdate: the state PVC is ReadWriteOnce, so a new pod
  # scheduled on another node cannot attach it while the old pod holds it
  # (seen on the 2026-09-29 opt-in rollout). Costs ~30-60 s of downtime per
  # deploy; the volume and everything on it survive.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: fee-insights
    spec:
      containers:
        - name: web
          image: fee-insights
          ports:
            - containerPort: 8000
          env:
            # Pod-network bind so the ClusterIP Service can reach the app;
            # chef-server owns the public route, TLS and auth.
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: SAT_EXCLUSIONS_PATH
              value: /state/sat_exclusions.json
          volumeMounts:
            # A new path -- never mounted over /app, where fees.duckdb lives.
            - name: state
              mountPath: /state
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: fee-insights-state
